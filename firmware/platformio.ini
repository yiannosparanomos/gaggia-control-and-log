; Gaggia ESP32 firmware
; Upload: `npm run flash` in web/ (it backs up the journal first). Docs: docs/development.md
; NEVER run `pio run -t uploadfs` or `pio run -t erase`: both wipe the journal stored on the ESP32.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two 1.5 MB firmware slots and 896 KB for the journal. Never change this without a backup
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Upload over WiFi. tools/flash.mjs passes the address with --upload-port
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota

; Tests that run on a PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11
build_src_filter = -<*>
