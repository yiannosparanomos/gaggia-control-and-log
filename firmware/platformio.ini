; Gaggia ESP32 firmware
; Build:   pio run              Upload:  pio run -t upload        Serial:  pio device monitor
; NEVER run `pio run -t uploadfs` or `pio run -t erase`: both wipe the journal stored on the ESP32.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Same layout as Arduino IDE "Default 4MB with spiffs", so the existing journal is kept
board_build.partitions = default.csv
board_build.filesystem = littlefs
; upload_port = COM7
; monitor_port = COM7
